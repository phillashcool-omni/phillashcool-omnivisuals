{% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/output.css' %}">
 {% include 'main/navbar.html' %}

<section class="relative h-screen flex flex-col items-center justify-center text-center overflow-hidden px-6 pt-4 pb-32" style="background: radial-gradient(ellipse at 30% 20%, rgba(236,72,153,0.15), transparent 50%), radial-gradient(ellipse at center, #1e1b4b 0%, #0c0a1f 45%, #000000 100%);">
            <div class="stars-bg"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star-blue"></div>
    <div class="logo-wrapper relative z-10 w-full max-w-md sm:max-w-2xl md:max-w-4xl mb-6">
        <img src="{% static 'images/logo.png' %}" alt="Phillashcool OmniVisuals logo" class="w-full">
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
                <path id="loopPath" d="M 50,32 C 32,14 12,50 50,32 C 88,14 68,50 50,32" fill="none" />
                <filter id="dotGlow">
                    <feGaussianBlur stdDeviation="1.2" result="blur" />
                </filter>
            </defs>
            <circle r="0.8" fill="#ffffff" opacity="0.8" filter="url(#dotGlow)">
                <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
                    <mpath href="#loopPath" />
                </animateMotion>
            </circle>
        </svg>
    </div>
    <div class="relative z-10 flex items-center gap-4 text-gray-300 text-lg sm:text-5xl tracking-widest uppercase -mt-40" style="font-family: 'Poppins', sans-serif;">
        <span class="w-12 h-px line-glow-blue"></span>
        <span class="moving-gradient-text font-semibold">WELCOME</span>
        <span class="w-12 h-px line-glow-orange"></span>
    </div>
</section>
