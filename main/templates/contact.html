{% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"> <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@300;600&display=swap" rel="stylesheet"> <link rel="stylesheet" href="{% static 'css/output.css' %}"> {% include 'main/navbar.html' %} <section class="relative min-h-screen flex flex-col items-center justify-center text-center overflow-hidden px-6 py-24" style="background: radial-gradient(ellipse at 30% 20%, rgba(236,72,153,0.15), transparent 50%), radial-gradient(ellipse at center, #1e1b4b 0%, #0c0a1f 45%, #000000 100%);"> <div class="stars-bg"></div> <h1 class="relative z-10 text-7xl sm:text-9xl mb-6 moving-gradient-text" style="font-family: 'Algerian', 'Archivo Black', sans-serif;"> CONTACT </h1> <p class="relative z-10 text-gray-200 text-lg mb-12" style="font-family: 'Poppins', sans-serif;"> Got a project in mind? Send us a message and let's bring it to life. </p> {% if success %} <p class="relative z-10 text-green-400 text-lg mb-6" style="font-family: 'Poppins', sans-serif;">Thanks! Your message has been sent — we'll get back to you soon.</p> {% endif %} <form method="POST" class="relative z-10 w-full max-w-xl flex flex-col gap-5 text-left"> {% csrf_token %} <div> <label class="text-gray-300 text-sm mb-1 block" style="font-family: 'Poppins', sans-serif;">Name</label> <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white focus:outline-none focus:border-blue-400" style="font-family: 'Poppins', sans-serif;"> </div> <div> <label class="text-gray-300 text-sm mb-1 block" style="font-family: 'Poppins', sans-serif;">Email</label> <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white focus:outline-none focus:border-blue-400" style="font-family: 'Poppins', sans-serif;"> </div> <div> <label class="text-gray-300 text-sm mb-1 block" style="font-family: 'Poppins', sans-serif;">Message</label> <textarea name="message" required rows="5" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/20 text-white focus:outline-none focus:border-blue-400" style="font-family: 'Poppins', sans-serif;"></textarea> </div> <button type="submit" class="bg-gradient-to-r from-blue-500 to-orange-500 text-white px-8 py-3 rounded-full font-semibold hover:opacity-90 transition" style="font-family: 'Poppins', sans-serif;"> Send Message </button> </form> </section>
